name: Release

# Builds the release APK and AAB for a version tag and attaches them, with SHA-256 checksums, to
# a draft GitHub Release. Signing is skipped (unsigned artifacts) unless the `release` environment
# has the BRIDLE_SIGNING_* secrets; see docs/release.md. Publishing the draft is a manual step.
# A manual run from a tag behaves like the tag push; from a branch it only uploads the build as a
# workflow artifact (and is refused if the environment only allows tags).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release artifacts
    runs-on: [self-hosted, linux, x64, kitefold-ghost, ephemeral]
    timeout-minutes: 45
    # Holds the signing secrets; restrict it to `v*` tags and add required reviewers.
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true # release builds start clean
      - name: Install tmux (integration tests drive a real tmux server)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tmux
      - name: Full gate (tests, lint, >=95% coverage, licenses)
        run: |
          ./gradlew check koverVerifyBridle --stacktrace
          ./gradlew checkLicense --no-configuration-cache --no-parallel --stacktrace
      - name: Decode signing key
        env:
          KEYSTORE_B64: ${{ secrets.BRIDLE_SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            umask 077
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "BRIDLE_SIGNING_STOREFILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing secrets; building unsigned artifacts."
          fi
      - name: Build APK and AAB
        env:
          BRIDLE_SIGNING_STOREPASSWORD: ${{ secrets.BRIDLE_SIGNING_STOREPASSWORD }}
          BRIDLE_SIGNING_KEYALIAS: ${{ secrets.BRIDLE_SIGNING_KEYALIAS }}
          BRIDLE_SIGNING_KEYPASSWORD: ${{ secrets.BRIDLE_SIGNING_KEYPASSWORD }}
        run: ./gradlew :app:assembleRelease :app:bundleRelease --no-build-cache --stacktrace
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
      - name: Collect artifacts and checksums
        run: |
          # Tag name for tag builds, short commit otherwise. AGP names the APK
          # app-release.apk when it signed it and app-release-unsigned.apk when it did not.
          if [ "$GITHUB_REF_TYPE" = tag ]; then name="$GITHUB_REF_NAME"; else name="${GITHUB_SHA::12}"; fi
          suffix=""
          [ -f app/build/outputs/apk/release/app-release.apk ] || suffix="-unsigned"
          mkdir dist
          cp app/build/outputs/apk/release/app-release*.apk "dist/Bridle-$name$suffix.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/Bridle-$name$suffix.aab"
          (cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-artifacts
          retention-days: 30
          path: dist/
          if-no-files-found: error

  draft-release:
    name: Create draft release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: [self-hosted, linux, x64, kitefold-ghost, ephemeral]
    timeout-minutes: 10
    permissions:
      contents: write # only this job, which runs no project code, can write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-artifacts
          path: dist
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "Bridle $TAG" --generate-notes
