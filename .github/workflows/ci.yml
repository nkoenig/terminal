name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Superseded PR builds are cancelled; every push to main still gets a complete run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pre-commit:
    name: Pre-commit hooks
    runs-on: [self-hosted, linux, x64, kitefold-ghost, ephemeral]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install pre-commit==4.3.0
      # Gradle-backed hooks run in the build job instead (with caching).
      - run: pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: ktlint,gradle-check

  build:
    name: Build, test, coverage gate
    runs-on: [self-hosted, linux, x64, kitefold-ghost, ephemeral]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Install tmux (integration tests drive a real tmux server)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tmux
      - name: Build, lint, test, verify >=95% coverage
        run: ./gradlew check koverVerifyBridle koverXmlReportBridle koverHtmlReportBridle --stacktrace
      # R8 only runs for release builds; catches missing keep/dontwarn rules (e.g. sshj's GSSAPI).
      - name: Assemble release (R8 minify)
        run: ./gradlew :app:assembleRelease --stacktrace
      # The license-report plugin resolves every project's classpath from a root task, which
      # Gradle 9 only allows without parallel execution or the configuration cache.
      - name: Check dependency licenses (Apache-2.0 compatible)
        run: ./gradlew checkLicense --no-configuration-cache --no-parallel --stacktrace
      - name: Coverage summary
        if: always()
        run: python3 scripts/coverage_summary.py build/reports/kover/reportBridle.xml >> "$GITHUB_STEP_SUMMARY"
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          retention-days: 14
          path: |
            build/reports/
            **/build/reports/
            **/build/test-results/
